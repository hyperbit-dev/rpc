name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dependency-tree validation only: several apps have pre-existing
      # build/lint breakage (missing deps, stale TS configs) that predates
      # this CI. `npm ci` gates the lockfile and workspace resolution.
      - run: npm ci
